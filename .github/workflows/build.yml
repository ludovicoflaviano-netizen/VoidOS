name: Build VoidOS
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib binutils grub-pc-bin grub-common xorriso qemu-system-x86
      - name: Build ISO
        run: make
      - name: Verify ISO
        run: test -s build/voidos.iso
      - uses: actions/upload-artifact@v4
        with:
          name: voidos-iso
          path: build/voidos.iso
